# k55d configuration. Put this file in the same folder as k55d.exe.
# After a change, right-click the tray icon and select "Reload k55d.ini".

# Color of the 5 lighting zones. The keyboard keeps it after k55d exits, until the keyboard loses power.
color = 5d6770

# win: the Fn key acts as the left Windows key (Fn+E opens the explorer, Fn+L locks the session).
# none: k55d does not change the Fn key.
fn = win
